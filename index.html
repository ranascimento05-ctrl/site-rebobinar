<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roberto Almeida do Nascimento - Portfólio Profissional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .profile-header {
            margin-bottom: 40px;
        }

        .profile-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #2c5aa0 0%, #5b86c5 100%);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(44, 90, 160, 0.3);
        }

        h1 {
            color: #2c5aa0;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .profession {
            color: #5a6c7d;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .experience {
            display: inline-block;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c5aa0;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            margin: 20px 0 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #2c5aa0 0%, #5b86c5 100%);
            margin: 30px auto;
            border-radius: 2px;
        }

        .book-section {
            margin-top: 40px;
        }

        .book-button {
            display: inline-block;
            background: linear-gradient(135deg, #2c5aa0 0%, #5b86c5 100%);
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(44, 90, 160, 0.4);
            cursor: pointer;
            border: none;
        }

        .book-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(44, 90, 160, 0.5);
        }

        .book-button:active {
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #8892a0;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            .profession {
                font-size: 1.1em;
            }

            .book-button {
                padding: 15px 40px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <div class="profile-icon">RN</div>
            <h1>Roberto Almeida do Nascimento</h1>
            <p class="profession">Engenheiro Ambiental e Escritor</p>
            <div class="experience">31 anos de experiência</div>
        </div>

        <div class="divider"></div>

        <div class="book-section">
            <button class="book-button" onclick="alert('Em breve você poderá visualizar o livro REBOBINAR!')">
                📖 Ver Livro REBOBINAR
            </button>
        </div>

        <div class="footer">
            <p>&copy; 2024 Roberto Almeida do Nascimento. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
